name: Weekly Cypress Tests

on:
  schedule:
    # Runs every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering
    inputs:
      language:
        description: 'Language for localization testing'
        required: false
        default: 'en'
        type: choice
        options:
          - en
      target_env:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
      colour_theme:
        description: 'Color theme'
        required: false
        default: 'default'
        type: choice
        options:
          - default
      parallel_streams:
        description: 'Number of parallel test streams'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      browser:
        description: 'Browser to run tests in'
        required: false
        default: 'chrome'
        type: choice
        options:
          - electron
          - chrome
          - edge
      test_scope:
        description: 'Test scope filter (all, integration, e2e)'
        required: false
        default: all
        type: choice
        options:
          - all
          - integration
          - e2e
      test_type:
        description: 'Test type filter (empty=all, api, ui)'
        required: false
        default: all
        type: choice
        options:
          - all
          - api
          - ui
      generate_coverage_report:
        description: 'Generate coverage report after tests'
        required: false
        default: false
        type: boolean
      generate_flaky_report:
        description: 'Generate flaky tests report after tests'
        required: false
        default: false
        type: boolean
      run_cypress_tests:
        description: 'Run Cypress tests'
        required: false
        default: true
        type: boolean

# The results-collection step pushes the test-run ledger to the orphan
# `test-results` branch, which requires write access to repo contents.
permissions:
  contents: write

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_cypress_tests != false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create sensitive data from secrets
        run: |
          mkdir -p cypress/sensitive-data
          echo '${{ secrets.DEV_USERS_JSON }}' > cypress/sensitive-data/dev-users.json

      - name: Determine spec pattern
        id: spec-pattern
        run: |
          TEST_SCOPE="${{ inputs.test_scope || 'all' }}"
          TEST_TYPE="${{ inputs.test_type || 'all' }}"

          # Build spec pattern based on scope and type
          if [ "$TEST_SCOPE" = "all" ] && [ "$TEST_TYPE" = "all" ]; then
            SPEC_PATTERN="cypress/**/*.spec.js"
          elif [ "$TEST_SCOPE" = "all" ] && [ "$TEST_TYPE" = "api" ]; then
            SPEC_PATTERN="cypress/integration/api/**/*.api.spec.js"
          elif [ "$TEST_SCOPE" = "all" ] && [ "$TEST_TYPE" = "ui" ]; then
            SPEC_PATTERN="cypress/{integration/ui,e2e}/**/*.ui.spec.js"
          elif [ "$TEST_SCOPE" = "integration" ] && [ "$TEST_TYPE" = "all" ]; then
            SPEC_PATTERN="cypress/integration/**/*.spec.js"
          elif [ "$TEST_SCOPE" = "integration" ] && [ "$TEST_TYPE" = "api" ]; then
            SPEC_PATTERN="cypress/integration/api/**/*.api.spec.js"
          elif [ "$TEST_SCOPE" = "integration" ] && [ "$TEST_TYPE" = "ui" ]; then
            SPEC_PATTERN="cypress/integration/ui/**/*.ui.spec.js"
          elif [ "$TEST_SCOPE" = "e2e" ] && [ "$TEST_TYPE" = "all" ]; then
            SPEC_PATTERN="cypress/e2e/**/*.spec.js"
          elif [ "$TEST_SCOPE" = "e2e" ] && [ "$TEST_TYPE" = "ui" ]; then
            SPEC_PATTERN="cypress/e2e/**/*.ui.spec.js"
          elif [ "$TEST_SCOPE" = "e2e" ] && [ "$TEST_TYPE" = "api" ]; then
            SPEC_PATTERN="cypress/e2e/**/*.spec.js"
            echo "::warning::E2E scope doesn't have API tests. Running all E2E tests."
          else
            SPEC_PATTERN="cypress/**/*.spec.js"
          fi

          echo "SPEC_PATTERN=${SPEC_PATTERN}" >> $GITHUB_OUTPUT
          echo "Selected spec pattern: ${SPEC_PATTERN}"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg LANGUAGE=${{ inputs.language || 'en' }} \
            --build-arg TARGET_ENV=${{ inputs.target_env || 'dev' }} \
            --build-arg COLOUR_THEME=${{ inputs.colour_theme || 'default' }} \
            --build-arg PARALLEL_STREAMS=${{ inputs.parallel_streams || '2' }} \
            -t cypress-tests .

      - name: Run Cypress tests in Docker
        id: cypress
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/cypress/reports:/e2e/cypress/reports \
            -v ${{ github.workspace }}/cypress/sensitive-data:/e2e/cypress/sensitive-data:ro \
            -e BROWSER=${{ inputs.browser || 'chrome' }} \
            -e SPEC_PATTERN="${{ steps.spec-pattern.outputs.SPEC_PATTERN }}" \
            cypress-tests

      - name: Register flaky tests
        if: always()
        env:
          RESULTS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_ENV: ${{ inputs.target_env || 'dev' }}
          CI: 'true'
          # git commit-tree needs an author/committer identity; actions/checkout
          # does not set one, so provide it here for the ledger push.
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: node scripts/collect-test-results.js --reports-dir cypress/reports/separate-reports

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -rf cypress/sensitive-data

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results-${{ github.run_number }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 30

  generate-coverage-report:
    runs-on: ubuntu-latest
    # Coverage is derived from static sources (expected/*.json and spec files), not test-run results,
    # so it has no dependency on cypress-tests and runs in parallel.
    if: ${{ inputs.generate_coverage_report == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run report:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_number }}
          path: reports/coverage-gaps.md
          retention-days: 30

  generate-flaky-report:
    runs-on: ubuntu-latest
    needs: cypress-tests
    # When cypress-tests runs: waits for it to finish (capturing the latest run data).
    # When cypress-tests is skipped (run_cypress_tests=false): runs independently against
    # the historical ledger on the test-results branch.
    # Skipped entirely only if the workflow itself is cancelled.
    if: ${{ !cancelled() && inputs.generate_flaky_report == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate flaky tests report
        run: npm run report:flaky

      - name: Upload flaky report
        uses: actions/upload-artifact@v7
        with:
          name: flaky-report-${{ github.run_number }}
          path: reports/flaky-tests.md
          retention-days: 30
